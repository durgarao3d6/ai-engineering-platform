<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="t d"><title id="t">Evaluation-first workflow</title><desc id="d">Define task, run isolated agent, evaluate outputs, compare baseline, and require human approval before external changes.</desc><rect width="1100" height="270" rx="22" fill="#f8fafc"/><text x="550" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#0f172a" font-weight="bold">From AI-generated code to evidence-based trust</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="28" y="91" width="183" height="100" rx="13" fill="#dbeafe" stroke="#60a5fa"/><rect x="244" y="91" width="183" height="100" rx="13" fill="#e0e7ff" stroke="#818cf8"/><rect x="460" y="91" width="183" height="100" rx="13" fill="#dcfce7" stroke="#4ade80"/><rect x="676" y="91" width="183" height="100" rx="13" fill="#fef3c7" stroke="#fbbf24"/><rect x="892" y="91" width="180" height="100" rx="13" fill="#fce7f3" stroke="#f472b6"/><g fill="#0f172a" font-size="18" font-weight="bold"><text x="119" y="132">1. Define task</text><text x="335" y="132">2. Run agent</text><text x="551" y="132">3. Evaluate</text><text x="767" y="132">4. Compare</text><text x="982" y="132">5. Approve</text></g><g fill="#334155" font-size="14"><text x="119" y="160">Expected outcome</text><text x="335" y="160">Isolated sandbox</text><text x="551" y="160">Tests + evidence</text><text x="767" y="160">Quality + cost</text><text x="982" y="160">Human gate</text></g></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M214 141h25m-7 -7 7 7-7 7"/><path d="M430 141h25m-7 -7 7 7-7 7"/><path d="M646 141h25m-7 -7 7 7-7 7"/><path d="M862 141h25m-7 -7 7 7-7 7"/></g><text x="550" y="232" fill="#475569" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Proposed MVP workflow — not yet implemented</text></svg>