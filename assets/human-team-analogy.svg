<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="t d"><title id="t">AI engineering platform human team analogy</title><desc id="d">A human team delegates work to a developer, reviewer, QA engineer, and manager. The AI platform mirrors these responsibilities with specialized agents, evaluation, and human approvals.</desc><rect width="1100" height="350" rx="22" fill="#0f172a"/><text x="550" y="42" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold">An AI agent needs the same checks as a human engineer</text><text x="550" y="73" fill="#94a3b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">The goal is reliable outcomes, not just generated code</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="45" y="112" width="460" height="184" rx="16" fill="#1e293b" stroke="#475569"/><rect x="595" y="112" width="460" height="184" rx="16" fill="#1e293b" stroke="#475569"/><text x="275" y="145" fill="#7dd3fc" font-size="21" font-weight="bold">Human software team</text><text x="825" y="145" fill="#86efac" font-size="21" font-weight="bold">AI engineering platform</text><g fill="#e2e8f0" font-size="17"><text x="275" y="184">Developer writes code</text><text x="275" y="215">Reviewer checks the change</text><text x="275" y="246">QA runs tests</text><text x="275" y="277">Lead approves release</text><text x="825" y="184">Coding agent proposes changes</text><text x="825" y="215">Review agent checks defects</text><text x="825" y="246">Evaluation engine verifies results</text><text x="825" y="277">Human approves sensitive actions</text></g></g><path d="M520 204h60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/><path d="m570 194 12 10-12 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/><text x="550" y="325" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Same accountability principles · Different execution tools</text></svg>